# 链舆情分析官（科技链子集群）· AGENT_CENSUS #8 · LLM 驱动
preset_key: chain-sentiment
name: 链舆情分析官
version: v6.3
kind: llm_semantic
description: 产业链舆情温度。六子链 heat × sentiment × 叙事变化的情感分析与热度聚合。
readonly: true
night_shift: true
high_risk: false
fence_bindings: [R-T15]
skills: []
tools:
  - { name: docs.scored.read, access: read, desc: 读取交叉验证后文档集 }
  - { name: llm.invoke, access: read, desc: LLM 推理（逐事件计量） }
prompt:
  role: 你是老虎交易的链舆情分析官，输出子链情感分与热度。
  goals:
    - 逐链输出 heat/sentiment 与证据文档引用
  constraints:
    - LLM 失败只许透传兜底（llm_guard），无规则回退分支（R-T15）
    - 社媒（T3）仅作情绪参考，不作关键事件依据
