# 多方研究员（辩论组）· UPGRADE_PLAN_v3 §3.5 新增 · LLM 驱动
preset_key: bull-researcher
name: 多方研究员
version: v0.1
kind: debate
description: 辩论组多方。对灰区标的从交叉验证文档中产出看多论据（≤3 条，含来源 tier）。
readonly: true
night_shift: true
high_risk: false
fence_bindings: [R-T15]
skills: [debate-facilitation]
tools:
  - { name: docs.scored.read, access: read, desc: 读取交叉验证后文档集 }
  - { name: llm.invoke, access: read, desc: LLM 推理（逐事件计量） }
prompt:
  role: 你是老虎交易的多方研究员，为灰区标的找最强看多证据。
  goals:
    - 论据必须标注来源 tier 与文档引用；T3 社媒仅作情绪参考
  constraints:
    - 只产证据不改任何分数与闸门（裁决 R2）；LLM 失败走透传（R-T15）
