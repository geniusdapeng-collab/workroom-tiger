# 股票交易行业 · 模型路由策略（bundle 第⑦装配槽，v3.0 通用模型路由系统）
# 金融铁律：宁可不答不可错答——LLM 失败只透传披露（passthrough-disclose），禁止降档重答；
# 盘中零 LLM（全部秒级决策纯规则）；LLM 负载全部在盘前/盘后批量窗口（天然谷时 ×0.2）。
version: "v3.0"
scenes:
  # —— 盘前批量语义标注（中坚档，谷时窗口） ——
  news-labeling:     { tier: L2, window: off-peak-only }                # 新闻实体消歧/情感/事件抽取（批量）
  tech-sentiment:    { tier: L2, window: off-peak-only }                # 科技子链舆情 heat×sentiment
  tech-risk:         { tier: L2, window: off-peak-only }                # 供应链/政策/专利风险预警
  # —— 决策级语义（旗舰档 + 金融降级语义） ——
  sector-narrative:  { tier: L3, noDowngrade: true, fallback: passthrough-disclose }  # 板块叙事兑现分（直接进决策分）
  debate:            { tier: L3, noDowngrade: true, fallback: passthrough-disclose }  # 多空辩论（≤3 只/日，灰区标的）
  # —— 治理面通用场景（继承底座默认即可，点名备查） ——
  intent-classify:   { tier: L1, fallback: rule-template }
  ask-synthesize:    { tier: L2, escalateOn: [thumbs-down] }
  quest-plan:        { tier: L2 }
  briefing:          { tier: L2 }
  ceo-decision:      { tier: L2 }
  ceo-deep-analysis: { tier: L3, noDowngrade: true, fallback: passthrough-disclose }
plans:
  lite:     { defaultShift: -1 }
  standard: { defaultShift: 0 }
  smart:    { defaultShift: 1 }
