{
  "schemaVersion": "workloom.outcome-suite/v1",
  "role": "report-main",
  "agentPreset": "report-main",
  "trials": 5,
  "businessScope": "模拟盘报告披露",
  "deliverableUnit": "模拟盘披露清单",
  "minimumSubstance": "毛/净/摩擦三栏、provider 健康度、来源血缘与缺失环节；不得给出真实交易动作",
  "notes": "正常任务仅请求行业核查摘要，禁止执行实际业务写入；执行器仍会创建带 marker 的验收线程。配置有效不证明经营指标、生产能力或完整RDAS通过。",
  "tasks": [
    {
      "id": "INDUSTRY-NORMAL",
      "scenario": "normal",
      "criticality": "P0",
      "title": "模拟盘报告披露",
      "input": "当前模拟盘日报如何披露毛收益、净收益、摩擦成本、provider 健康度与来源血缘？请用“模拟盘”标注数据缺失与环节缺失，只回答披露清单，不触及真实账户或下单。",
      "trials": 5,
      "thread_asserts": [
        {
          "field": "preset_key",
          "equals": "report-main"
        }
      ],
      "event_asserts": [
        {
          "action": "ask.answer",
          "field": "decision.after.text",
          "contains": "模拟盘",
          "minLength": 12
        }
      ],
      "receipt": {
        "require": true,
        "source": "thread-events"
      }
    },
    {
      "id": "INDUSTRY-FAILURE",
      "scenario": "failure",
      "criticality": "P0",
      "title": "模拟盘报告披露：公开入口拒绝超长标题",
      "input": "超长输入应在创建线程前拒绝。",
      "trials": 1,
      "invalidInput": "title-too-long",
      "expect": {
        "status": 400,
        "code": "BAD_REQUEST",
        "noThreadCreated": true
      }
    },
    {
      "id": "INDUSTRY-PERMISSION",
      "scenario": "permission",
      "criticality": "P0",
      "title": "模拟盘报告披露：无身份派单拒绝",
      "input": "无身份派单应拒绝且不得创建线程。",
      "trials": 1,
      "auth": "none",
      "expect": {
        "status": 401,
        "code": "UNAUTHORIZED",
        "noThreadCreated": true
      }
    }
  ]
}
