server {
    listen 80;
    listen [::]:80;
    server_name tigerpnl.com www.tigerpnl.com;
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/tiger-pnl-acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 308 https://tigerpnl.com$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.tigerpnl.com;
    ssl_certificate /etc/letsencrypt/live/tiger-pnl-tigerpnl.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tiger-pnl-tigerpnl.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    location / { return 308 https://tigerpnl.com$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name tigerpnl.com;
    ssl_certificate /etc/letsencrypt/live/tiger-pnl-tigerpnl.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tiger-pnl-tigerpnl.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    client_max_body_size 1m;
    client_body_timeout 15s;
    location = /api/v1/research {
        client_max_body_size 4m;
        proxy_pass http://127.0.0.1:4348;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 25s;
        proxy_send_timeout 20s;
    }
    location ^~ /api/v1/ {
        proxy_pass http://127.0.0.1:4348;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 25s;
        proxy_send_timeout 20s;
    }
    location / { return 503; }
}
