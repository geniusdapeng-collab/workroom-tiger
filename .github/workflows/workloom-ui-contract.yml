name: workloom-ui-contract

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ui-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      WORKLOOM_DIR: governance
      NODE_ENV: test
      LLM_PROVIDER: mock
      TOOL_UNVERIFIED_RATE: "0"
      APP_DB_PASSWORD: mockapp
      GATEWAY_DB_PASSWORD: mockgw
      JWT_SECRET: ci-only-jwt-signing-key-not-for-deployment
      PII_KEY: ci-only-pii-key-not-for-deployment
      RUN_FENCE_PROPOSAL_PG_TESTS: "1"
      RUN_CONTRACT_DRIFT_PG_TESTS: "1"
      RUN_FRONTEND_CONTRACT_PG_TESTS: "1"
      RUN_DEVTOOLS_PERMISSION_PG_TESTS: "1"
    services:
      postgres:
        # Official pgvector image: PostgreSQL 17 with the required vector extension.
        image: pgvector/pgvector:0.8.7-pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: mock
          POSTGRES_DB: workloom_tiger_ci
        ports:
          # CI-2026-1027-TIGER-SERVICE-PORT: let Docker select an available host port.
          - 5432
        options: >-
          --health-cmd "pg_isready -U postgres -d workloom_tiger_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: 绑定 PostgreSQL 动态服务端口
        env:
          PGPORT: ${{ job.services.postgres.ports[5432] }}
        run: |
          set -euo pipefail
          if [[ ! "${PGPORT:-}" =~ ^[1-9][0-9]{0,4}$ ]] || (( PGPORT > 65535 )); then
            echo "::error::PostgreSQL service port is missing or invalid"
            exit 1
          fi
          {
            printf 'TIGER_TEST_DATABASE_PORT=%s\n' "$PGPORT"
            printf 'DATABASE_URL=postgres://postgres:mock@127.0.0.1:%s/workloom_tiger_ci\n' "$PGPORT"
            printf 'DATABASE_APP_URL=postgres://workloom_app:mockapp@127.0.0.1:%s/workloom_tiger_ci\n' "$PGPORT"
            printf 'DATABASE_GATEWAY_URL=postgres://workloom_gateway:mockgw@127.0.0.1:%s/workloom_tiger_ci\n' "$PGPORT"
          } >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.19.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: corepack enable && corepack prepare pnpm@10.14.0 --activate
      - run: pnpm -C "$WORKLOOM_DIR" install --frozen-lockfile
      - name: 初始化隔离 PostgreSQL 与交易装配
        run: |
          set -euo pipefail
          # Package entry points expect an env file; values remain in the job environment.
          touch "$WORKLOOM_DIR/.env"
          pnpm -C "$WORKLOOM_DIR" db:migrate
          pnpm -C "$WORKLOOM_DIR" db:seed:trading
      - name: 在独立数据库验证交易种子幂等与回滚
        run: |
          set -euo pipefail
          (cd "$WORKLOOM_DIR" && node --input-type=module -e '
            import pg from "pg";
            const db = new pg.Client({ connectionString: process.env.DATABASE_URL });
            try { await db.connect(); await db.query("CREATE DATABASE workloom_tiger_ci_seed"); }
            finally { await db.end(); }
          ')
          export DATABASE_URL="${DATABASE_URL%/workloom_tiger_ci}/workloom_tiger_ci_seed"
          export DATABASE_APP_URL="${DATABASE_APP_URL%/workloom_tiger_ci}/workloom_tiger_ci_seed"
          export DATABASE_GATEWAY_URL="${DATABASE_GATEWAY_URL%/workloom_tiger_ci}/workloom_tiger_ci_seed"
          pnpm -C "$WORKLOOM_DIR" db:migrate
          (cd "$WORKLOOM_DIR" && RUN_TRADING_SEED_PG_TESTS=1 node --test --test-concurrency=1 scripts/seed-trading.pg.test.mjs)
      - name: 禁止 UI 分叉并校验三端版本
        run: node "$WORKLOOM_DIR/scripts/verify-ui-consumer.mjs" --repo "$WORKLOOM_DIR" --require-governance-state
      - name: 校验三端应用壳指纹与行业扩展边界
        run: node scripts/ci/verify-tiger-client-repairs.mjs
      - name: 校验产品身份与全量行业包治理
        run: |
          (cd "$WORKLOOM_DIR" && node scripts/verify-product-content.mjs)
          (cd "$WORKLOOM_DIR" && pnpm exec tsx scripts/bundle-governance.mts)
      - name: 执行仓库已有测试
        run: |
          set -euo pipefail
          node --test pnl/test/*.test.mjs
          for script in pnl/deploy/*.sh; do bash -n "$script"; done
          node --test tests/install-contract.test.mjs tests/ui-artifact-mirror.test.mjs tests/client-repair-provenance.test.mjs tests/acceptance-route-contract.test.mjs
          pnpm -C "$WORKLOOM_DIR" exec vitest run scripts/release-gate.test.ts
          pnpm -C "$WORKLOOM_DIR" test
          RUN_DB_TESTS=1 pnpm -C "$WORKLOOM_DIR/packages/base" test fence-engine/fence-engine.test.ts
          # The sequence assertions share one database and must run serially.
          RUN_RUNTIME_SCHEMA_PG_TESTS=1 pnpm -C "$WORKLOOM_DIR/packages/runtime" test src/runtime-schema.pg.test.ts
          RUN_RUNTIME_SCHEMA_PG_TESTS=1 pnpm -C "$WORKLOOM_DIR/apps/server" test src/trpc/thread-number.pg.test.ts
          RUN_THREAD_RESUME_PG_TESTS=1 ASK_WEB_SEARCH=0 pnpm -C "$WORKLOOM_DIR/apps/server" test src/trpc/thread-resume.pg.test.ts
          RUN_TASK_PLAN_PG_TESTS=1 pnpm -C "$WORKLOOM_DIR" exec vitest run apps/server/src/trpc/thread-plan-visibility.pg.test.ts --testTimeout 30000
          RUN_IM_SCOPE_PG_TESTS=1 pnpm -C "$WORKLOOM_DIR/apps/server" test src/trpc/im-scope.pg.test.ts --no-file-parallelism --maxWorkers=1
          RUN_ROSTER_PROFILE_PG_TESTS=1 pnpm -C "$WORKLOOM_DIR/apps/server" test src/trpc/roster-profile.pg.test.ts --no-file-parallelism --maxWorkers=1
          # Fault-injection tests temporarily hold table DDL locks; keep each command serial.
          RUN_SERVICE_GATEWAY_PG_TESTS=1 pnpm -C "$WORKLOOM_DIR/apps/server" test src/service/gateway.pg.test.ts
          RUN_MEMORY_SCOPE_PG_TESTS=1 pnpm -C "$WORKLOOM_DIR/packages/base" test review-console/approval-memory.pg.test.ts workdata/memory-id.test.ts
          RUN_CAPTAIN_BREAKER_PG_TESTS=1 pnpm -C "$WORKLOOM_DIR/packages/base" test captain/breaker.pg.test.ts captain/kpi.test.ts
          RUN_CAPTAIN_QUEUE_PG_TESTS=1 pnpm -C "$WORKLOOM_DIR/packages/base" test captain/queue.pg.test.ts
          RUN_CAPTAIN_QUEUE_BOUNDARY_PG_TESTS=1 pnpm -C "$WORKLOOM_DIR/packages/base" test captain/queue-boundaries.pg.test.ts
          pnpm -C "$WORKLOOM_DIR" suite
          if [ -f requirements.txt ] && [ -d tests ] && find tests -type f -name 'test_*.py' -print -quit | grep -q .; then
            python -m pip install --disable-pip-version-check -r requirements.txt
            TIGER_TEST_NODE="$(command -v node)" python -m pytest -q
          fi
      - name: 验证 Tiger CLI、MCP、配置与真实 Python 协议
        run: |
          set -euo pipefail
          TIGER_TEST_PYTHON="$(command -v python)" node --test \
            bundles/trading/capabilities/workflow-client.test.mjs \
            bundles/trading/capabilities/workflow-model-required.test.mjs \
            bundles/trading/capabilities/workflow-short-term-v2.test.mjs \
            bundles/trading/capabilities/repo.test.mjs \
            scripts/tiger-agent.test.mjs scripts/tiger-agent-mcp.test.mjs \
            scripts/tiger-agent-config.test.mjs \
            scripts/agent-capabilities.test.mjs governance/scripts/agent-capabilities.test.mjs
      - name: 三端逐一类型检查与生产构建
        run: |
          set -euo pipefail
          pnpm -C "$WORKLOOM_DIR" typecheck
          for CLIENT in web webb webc; do
            test -f "$WORKLOOM_DIR/apps/$CLIENT/package.json"
            NODE_ENV=production pnpm -C "$WORKLOOM_DIR/apps/$CLIENT" build
          done
      - name: 安装 Chromium
        run: pnpm -C "$WORKLOOM_DIR/apps/web" exec playwright install --with-deps chromium
      - name: 验证体验探针绑定真实界面动作与结果
        env:
          MC036_EVIDENCE_DIR: ${{ github.workspace }}/governance/acceptance-browser-evidence/MC036
        run: |
          set -euo pipefail
          cd "$WORKLOOM_DIR"
          node --test --test-concurrency=1 scripts/acceptance/lib/ui-evidence.test.mjs scripts/acceptance/lib/response-observer.test.mjs
      - name: 验证版本徽标、未读数量与助手视口布局
        env:
          MC033_EVIDENCE_DIR: ${{ github.workspace }}/governance/acceptance-browser-evidence/MC033
          MC034_EVIDENCE_DIR: ${{ github.workspace }}/governance/acceptance-browser-evidence/MC034
          MC035_EVIDENCE_DIR: ${{ github.workspace }}/governance/acceptance-browser-evidence/MC035
          MC037_EVIDENCE_DIR: ${{ github.workspace }}/governance/acceptance-browser-evidence/MC037
          MC038_EVIDENCE_DIR: ${{ github.workspace }}/governance/acceptance-browser-evidence/MC038
          MC039_EVIDENCE_DIR: ${{ github.workspace }}/governance/acceptance-browser-evidence/MC039
          MC041_EVIDENCE_DIR: ${{ github.workspace }}/governance/acceptance-browser-evidence/MC041
        run: |
          cd "$WORKLOOM_DIR"
          node --test --test-concurrency=1 scripts/acceptance/lib/level-badge-layout.test.mjs scripts/acceptance/lib/loommate-unread-contrast.test.mjs scripts/acceptance/lib/loommate-viewport.test.mjs scripts/acceptance/lib/loommate-stacking.test.mjs scripts/acceptance/lib/skill-suggestion-layout.test.mjs scripts/acceptance/lib/task-notification-interception.test.mjs scripts/acceptance/lib/task-plan-visibility.test.mjs scripts/acceptance/lib/task-plan-evidence.test.mjs
      - name: 三端生产预览主入口与首帧横向溢出冒烟
        run: CI=true pnpm -C "$WORKLOOM_DIR/apps/web" test:consumer
      - name: 留存三端浏览器冒烟证据
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: workloom-ui-consumer-${{ github.run_id }}
          path: |
            governance/apps/web/playwright-report/consumer
            governance/apps/web/test-results/consumer
            governance/acceptance-browser-evidence
          if-no-files-found: warn
          retention-days: 30
