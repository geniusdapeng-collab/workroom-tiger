# WorkLoom 桌面客户端 · Windows/macOS 安装包 CI
# 触发：打 tag（v*）或手动 dispatch；产出上传 GitHub Release
# 产物：Windows NSIS 安装包（.exe）+ macOS DMG（.dmg，双架构）
name: build-desktop

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            builder: --win nsis
            artifact: governance/release/*.exe
          - os: macos-latest
            builder: --mac dmg --universal
            artifact: governance/release/*.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: 进入治理外壳目录
        run: echo "已切到 governance/（股票系统 TS 治理外壳）"
        working-directory: governance

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安装依赖（electron-builder 打包用，无需数据库）
        run: pnpm install --frozen-lockfile=false
        working-directory: governance
        env:
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/

      - name: 构建安装包
        run: pnpm exec electron-builder ${{ matrix.builder }} --publish never
        working-directory: governance
        env:
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
          # 未配置代码签名：Windows 跳过 signtool、macOS 跳过 notarize
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: 上传 Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact }}
          generateReleaseNotes: true

      - name: 上传构件（手动触发时也可下载）
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: ${{ matrix.artifact }}
          retention-days: 14
