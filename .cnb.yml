.oss-gate: &oss_gate
  name: oss-gate
  docker:
    image: node:24.19.0-bookworm
  stages:
    - name: 开源组件清单一致性（oss-watch）
      script: |
        set -eu
        node --test scripts/oss-inventory.test.mjs
        node scripts/oss-inventory.mjs --check

.py-gate: &py_gate
  name: py-gate
  docker:
    image: python:3.12-bookworm
  stages:
    - name: 依赖安装
      script: |
        set -eu
        python -V
        pip install --quiet -r requirements.txt

    - name: 交易内核测试（pytest）
      script: |
        set -eu
        python -m pytest -q

    - name: 内核红线自检（21 环节注册表与围栏生成物）
      script: |
        set -eu
        python -c "import trading_system.redline as r; assert len(r.STEP_REGISTRY) >= 21, len(r.STEP_REGISTRY); print('STEP_REGISTRY', len(r.STEP_REGISTRY))"
        python -m pytest -q tests/test_gen_fences.py

.protocol-gate: &protocol_gate
  name: protocol-gate
  docker:
    image: node:24.19.0-bookworm
  stages:
    - name: UI 消费契约（governance 子树：稳定制品 + 三端实际渲染）
      script: |
        set -eu
        corepack enable
        corepack prepare pnpm@10.14.0 --activate
        cd governance
        pnpm install --frozen-lockfile
        node scripts/verify-ui-consumer.mjs --repo . --require-governance-state
        node scripts/verify-client-foundation-consumer.mjs --repo .

    - name: 协议门禁（提交规范 + 并发冲突）
      script: |
        set -eu
        node --test governance/scripts/ci/protocol-rules.test.mjs
        node governance/scripts/ci/verify-commit-msg.mjs --self-test
        node governance/scripts/ci/verify-lock-conflict.mjs --self-test
        node governance/scripts/ci/verify-commit-msg.mjs
        node governance/scripts/ci/verify-lock-conflict.mjs

    - name: 交付证据、预算与行业配置回归
      script: |
        set -eu
        cd governance
        # The CLI fixture drops ambient NODE_PATH; expose only the pinned test package.
        instrumentation_dir=$(mktemp -d)
        playwright_link_created=0
        trap 'if [ "$playwright_link_created" = 1 ]; then rm -f node_modules/playwright; fi; rm -rf "$instrumentation_dir"' EXIT HUP INT TERM
        npm install --prefix "$instrumentation_dir" playwright@1.63.0 --ignore-scripts --no-audit --no-fund
        if [ ! -e node_modules/playwright ] && [ ! -L node_modules/playwright ]; then
          ln -s "$instrumentation_dir/node_modules/playwright" node_modules/playwright
          playwright_link_created=1
        fi
        pnpm test:governance
        node scripts/generate-capabilities.mjs --check
        node scripts/acceptance/profile-check.mjs --repo .

    - name: 媒体真实解码与完整 CLI 回归（隔离夹具）
      script: |
        set -eu
        cd governance
        instrumentation_dir=$(mktemp -d)
        trap 'rm -rf "$instrumentation_dir"' EXIT HUP INT TERM
        npm install --prefix "$instrumentation_dir" playwright@1.63.0 --ignore-scripts --no-audit --no-fund
        export PLAYWRIGHT_BROWSERS_PATH="$instrumentation_dir/browsers"
        node "$instrumentation_dir/node_modules/playwright/cli.js" install --with-deps chromium
        export NODE_PATH="$instrumentation_dir/node_modules${NODE_PATH:+:$NODE_PATH}"
        pnpm test:media

.desktop-mac-release: &desktop_mac_release
  name: tiger-mac-native-release
  runner:
    namespace: group
    tags: [mac, arm64]
  stages:
    - name: Mac M 原生签名、公证与最终资源验收（必需）
      script: |
        set -eu
        version="0.1.0-$(git rev-parse --short=12 HEAD)"
        bash governance/scripts/build-tiger-desktop-native.sh "$version"

.desktop-win-release: &desktop_win_release
  name: tiger-windows-native-release
  runner:
    namespace: group
    tags: [windows]
  stages:
    - name: Windows x64 原生编译、签名与最终资源验收（必需）
      script: |
        $ErrorActionPreference = "Stop"
        $revision = (git rev-parse --short=12 HEAD).Trim()
        if ($LASTEXITCODE -ne 0) { throw "无法读取构建 commit" }
        & .\governance\scripts\build-tiger-desktop-native.ps1 -Version "0.1.0-$revision"

.desktop-mac-candidate: &desktop_mac_candidate
  name: tiger-mac-native-candidate
  runner:
    namespace: group
    tags: [mac, arm64]
  stages:
    - name: Mac M 原生候选包与最终资源验收（必需）
      script: |
        set -eu
        version="0.1.0-$(git rev-parse --short=12 HEAD)"
        bash governance/scripts/build-tiger-desktop-native.sh "$version" --candidate

.desktop-win-candidate: &desktop_win_candidate
  name: tiger-windows-native-candidate
  runner:
    namespace: group
    tags: [windows]
  stages:
    - name: Windows x64 原生候选包与最终资源验收（必需）
      script: |
        $ErrorActionPreference = "Stop"
        $revision = (git rev-parse --short=12 HEAD).Trim()
        if ($LASTEXITCODE -ne 0) { throw "无法读取构建 commit" }
        & .\governance\scripts\build-tiger-desktop-native.ps1 -Version "0.1.0-$revision" -Candidate

# Native jobs have no allow_failure bypass. Source PRs run the Linux gates; native
# candidates run on the explicit api_trigger_tiger_native_candidate event. Production
# builds on main still require both native runners, signing, notarization and smoke.
# Missing runners or credentials remain failed native builds and cannot prove delivery.
main:
  push:
    - *py_gate
    - *oss_gate
    - *protocol_gate
    - *desktop_mac_release
    - *desktop_win_release

"**":
  pull_request:
    - *py_gate
    - *oss_gate
    - *protocol_gate
  api_trigger_tiger_native_candidate:
    - *desktop_mac_candidate
    - *desktop_win_candidate

# 每周开源组件上游扫描（周一 07:00，CNB crontab 使用 Asia/Shanghai 时区）：
#   刷新「当前版本 + 上游最新版本」清单与更新计划；有变化即开 chore/oss-watch-* PR（扫描只刷新事实）。
#   升级由 AI 按协议 §1/§9.5 执行（门禁全绿 + 串行 + 冷却期后合并）；破坏性/大版本升级须在 PR 显著标注并按 §3 人审放行；人保留叫停与回滚权。
$:
  "crontab: 0 7 * * 1":
    - name: oss-watch-weekly
      docker:
        image: node:24.19.0-bookworm
      stages:
        - name: 扫描上游最新版本并开刷新 PR
          script: |
            set -eu
            node scripts/oss-inventory.mjs --self-test
            node scripts/oss-watch-ci.mjs --exit-zero
