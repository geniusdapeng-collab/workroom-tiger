.oss-gate: &oss_gate
  name: oss-gate
  docker:
    image: node:24.19.0-bookworm
  stages:
    - name: 开源组件清单一致性（oss-watch）
      script: |
        set -eu
        node --test scripts/oss-inventory.test.mjs
        node scripts/oss-inventory.mjs --check

.py-gate: &py_gate
  name: py-gate
  docker:
    image: python:3.12-bookworm
  stages:
    - name: 依赖安装
      script: |
        set -eu
        python -V
        pip install --quiet -r requirements.txt

    - name: 交易内核测试（pytest）
      script: |
        set -eu
        python -m pytest -q

    - name: 内核红线自检（21 环节注册表与围栏生成物）
      script: |
        set -eu
        python -c "import trading_system.redline as r; assert len(r.STEP_REGISTRY) >= 21, len(r.STEP_REGISTRY); print('STEP_REGISTRY', len(r.STEP_REGISTRY))"
        python -m pytest -q tests/test_gen_fences.py

.protocol-gate: &protocol_gate
  name: protocol-gate
  docker:
    image: node:24.19.0-bookworm
  stages:
    - name: UI 消费契约（governance 子树：稳定制品 + 三端实际渲染）
      script: |
        set -eu
        corepack enable
        corepack prepare pnpm@10.14.0 --activate
        cd governance
        pnpm install --frozen-lockfile
        node scripts/verify-ui-consumer.mjs --repo . --require-governance-state
        node scripts/verify-client-foundation-consumer.mjs --repo .

    - name: 协议门禁（提交规范 + 并发冲突）
      script: |
        set -eu
        node --test scripts/ci/protocol-rules.test.mjs
        node scripts/ci/verify-commit-msg.mjs --self-test
        node scripts/ci/verify-lock-conflict.mjs --self-test
        node scripts/ci/verify-commit-msg.mjs
        node scripts/ci/verify-lock-conflict.mjs

main:
  push:
    - *py_gate
    - *oss_gate
    - *protocol_gate

"**":
  pull_request:
    - *py_gate
    - *oss_gate
    - *protocol_gate

# 每周开源组件上游扫描（周一 07:00，CNB crontab 使用 Asia/Shanghai 时区）：
#   刷新「当前版本 + 上游最新版本」清单与更新计划；有变化即开 chore/oss-watch-* PR（扫描只刷新事实）。
#   升级由 AI 按协议 §1/§9.5 执行（门禁全绿 + 串行 + 冷却期后合并）；破坏性/大版本升级须在 PR 显著标注并按 §3 人审放行；人保留叫停与回滚权。
$:
  "crontab: 0 7 * * 1":
    - name: oss-watch-weekly
      docker:
        image: node:24.19.0-bookworm
      stages:
        - name: 扫描上游最新版本并开刷新 PR
          script: |
            set -eu
            node scripts/oss-inventory.mjs --self-test
            node scripts/oss-watch-ci.mjs --exit-zero
